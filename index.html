<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuscleBoost V15</title>
<style>
body{font-family:-apple-system;background:#F5F5F7;margin:0;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.big{font-size:32px;text-align:center;font-weight:700}
button{padding:14px;border:none;border-radius:12px;margin:4px;font-weight:600}
input{padding:10px;border-radius:10px;border:1px solid #ccc;margin:4px;width:30%}
</style>
</head>
<body>

<div class="card">
<div id="exercise" class="big"></div>
<div id="timer" class="big"></div>
<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<div>
<button onclick="feedback('easy')">Fácil</button>
<button onclick="feedback('normal')">Normal</button>
<button onclick="feedback('hard')">Difícil</button>
</div>
<div id="next"></div>
</div>

<div class="card">
<input id="w" placeholder="Peso">
<input id="arm" placeholder="Braço">
<input id="waist" placeholder="Cintura">
<button onclick="save()">Guardar</button>
<div id="analysis"></div>
</div>

<script>

let S={
 level:2,
 t:30,
 running:false,
 data:JSON.parse(localStorage.getItem("mb_body")||"[]"),
 sessions:JSON.parse(localStorage.getItem("mb_sessions")||"{}"),
 feedback:[]
}

const ex=[
"Push-ups","Decline push-ups","Explosive push-ups",
"Curl garrafão","Hammer curl","Slow curl",
"Plank","Side plank","Leg raises"
];

function baseTime(){return 30+S.level*5;}
function getEx(){return ex[S.level-1];}

function update(){
 exercise.innerText=getEx();
 next.innerText="Próximo: "+ex[Math.min(S.level,ex.length-1)];
 timer.innerText=S.t;
}

let interval;
function start(){
 if(!S.running){
  S.running=true;
  interval=setInterval(tick,1000);
 }
}

function pause(){
 S.running=false;
 clearInterval(interval);
}

function tick(){
 S.t--;
 if(S.t<=5 && S.t>0){beep(); if(navigator.vibrate) navigator.vibrate(100);}
 if(S.t<=0){
  markSession();
  pause();
  S.t=baseTime();
 }
 update();
}

let audioCtx;
function beep(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 let o=audioCtx.createOscillator();
 let g=audioCtx.createGain();
 o.connect(g); g.connect(audioCtx.destination);
 g.gain.value=0.1;
 o.start(); setTimeout(()=>o.stop(),120);
}

function feedback(f){
 S.feedback.push(f);
 if(S.feedback.length>2) S.feedback.shift();

 if(S.feedback.length==2){
  if(S.feedback[0]=='easy'&&S.feedback[1]=='easy') S.level++;
  if(S.feedback[0]=='hard'&&S.feedback[1]=='hard') S.level--;
 }

 S.level=Math.max(1,Math.min(9,S.level));
 S.t=baseTime();
 update();
}

function markSession(){
 let d=new Date().toISOString().slice(0,10);
 S.sessions[d]=(S.sessions[d]||0)+1;
 localStorage.setItem("mb_sessions",JSON.stringify(S.sessions));
}

function consistency(){
 let last7=0;
 let today=new Date();
 for(let i=0;i<7;i++){
  let d=new Date(); d.setDate(today.getDate()-i);
  let k=d.toISOString().slice(0,10);
  if(S.sessions[k]) last7++;
 }
 return last7/7;
}

function save(){
 let rec={
  w:parseFloat(w.value),
  arm:parseFloat(arm.value),
  waist:parseFloat(waist.value),
  d:Date.now()
 };
 S.data.push(rec);
 localStorage.setItem("mb_body",JSON.stringify(S.data));
 analyze();
}

function analyze(){
 if(S.data.length<2){
  analysis.innerText="Sem dados suficientes";
  return;
 }

 let a=S.data[S.data.length-2];
 let b=S.data[S.data.length-1];

 let dw=b.w-a.w;
 let da=b.arm-a.arm;
 let cons=consistency();

 // weighted projection
 let rateW=dw*(1+cons);
 let rateA=da*(1+cons);

 let projW=(rateW*6).toFixed(2);
 let projA=(rateA*6).toFixed(2);

 let interp="";
 if(dw>0 && da>0 && cons>0.6) interp="Hipertrofia consistente";
 else if(dw>0 && da>0) interp="Ganho provável";
 else if(dw>0) interp="Ganho gordura provável";
 else interp="Sem progresso";

 analysis.innerText=
 interp+
 "\nConsistência: "+Math.round(cons*100)+"%"+
 "\nΔPeso "+dw.toFixed(2)+"kg | ΔBraço "+da.toFixed(2)+"cm"+
 "\nProjeção 6 semanas: +"+projW+"kg | +"+projA+"cm braço";
}

S.t=baseTime();
update();
analyze();

</script>

</body>
</html>
